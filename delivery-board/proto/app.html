.ev{position:absolute;left:4px;right:6px;border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;gap:1px;text-align:left;font:inherit;color:#0a0a0a;cursor:pointer;overflow:hidden;box-sizing:border-box}
.ev:hover{filter:brightness(.985)}

.ev-g{margin-left:auto;color:#737373}

.ev-s{font-size:11px;line-height:16px;color:#5c5c5c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.sm{padding:5px 8px;gap:0}.ev.sm .ev-s{display:none}

KEYS.forEach(k=>{const host=k==='confirm'?$('#h-confirm'):$('#s-'+k);const sr=host.attachShadow({mode:'open'});
  sr.appendChild($('#t-'+k).content.cloneNode(true));
  sr.appendChild(Object.assign(document.createElement('style'),{textContent:'.al{min-height:0!important;height:100%}.x-h{cursor:pointer}.x-gone{display:none!important}button,a{cursor:pointer}'}));
  R[k]=sr;H[k]=k==='confirm'?$('#s-confirm'):host});
const byText=(root,sel,t)=>$$(sel,root).find(e=>e.textContent.replace(/\s+/g,' ').trim().startsWith(t));
const on=(el,fn)=>{if(!el)return;el.dataset.h='1';el.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();fn(e)})};

/* fit 1440x900 */
function fit(){const s=Math.min(innerWidth/1440,innerHeight/900);app.style.transform=`scale(${s})`;app.style.left=Math.max(0,(innerWidth-1440*s)/2)+'px';app.style.top=Math.max(0,(innerHeight-900*s)/2)+'px'}
addEventListener('resize',fit);fit();

/* toast */
let tt;function toast(m,ms){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),ms||2800)}
const NA=()=>toast('Not part of this demo.');

/* navigation */
let cur='board',done=false;
function go(k){hideDone();KEYS.forEach(s=>H[s].hidden=s!==k);cur=k;app.classList.toggle('on-confirm',k==='confirm');ENTER[k]&&ENTER[k]();post()}
function post(){if(parent!==window)parent.postMessage({type:'db-screen',i:done?6:STEP[cur]},'*')}
function showDone(){go('material');done=true;$('#done').hidden=false;$('#done .dn-rs').focus();post()}
function hideDone(){done=false;$('#done').hidden=true}
on($('#done .dn-rs'),()=>location.reload());on($('#done .dn-st'),()=>{hideDone();post()});
addEventListener('message',e=>{const d=e.data||{};if(d.type==='db-go'){if(d.i===6)showDone();else go(GO[d.i])}if(d.type==='db-reset')location.reload()});
const ENTER={};

/* shared wiring for every screen */
KEYS.forEach(k=>{const r=R[k];
  /* sidebar */
  $$('.side .nav a,.side .nav button',r).forEach(a=>on(a,()=>{const t=a.textContent.trim();if(t.startsWith('Deliveries'))go('board');else if(t.startsWith('Materials'))go('material');else NA()}));
  $$('.side .proj,.side .me,.side .brand .ib',r).forEach(b=>on(b,NA));
  /* segmented controls and filter chips */
  r.addEventListener('click',e=>{const b=e.target.closest('.seg button');if(b&&!b.closest('.vt')){$$('button',b.parentNode).forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',x===b)});SEG[k]&&SEG[k](b)}
    const t=e.target.closest('.tab');if(t){$$('.tab',t.parentNode).forEach(x=>{x.classList.toggle('on',x===t);x.setAttribute('aria-pressed',x===t)});if(!/^Deliveries/.test(t.textContent.trim()))toast('Only the Deliveries tab is in this demo.')}
    const c=e.target.closest('.fchip');if(c){c.classList.toggle('on')}},true);
  /* anything else says so */
  r.addEventListener('click',e=>{const el=e.target.closest('button,a');if(!el)return;if(el.dataset.h||el.closest('.seg,.tabs')||el.classList.contains('fchip')||el.classList.contains('tab'))return;e.preventDefault();NA()});
});
const SEG={};

/* board-like screens: view toggle, create, events */
function boardWire(k){const r=R[k];
  on(byText(r,'button','List'),()=>go('list'));on(byText(r,'button','Calendar'),()=>go('board'));
  on(byText(r,'button','Create delivery'),()=>go('create'));
  $$('.ev',r).forEach(ev=>on(ev,()=>{const t=ev.textContent;if(/Steel package 2/.test(t))go('detail');else if(/Steel package 3/.test(t))go('supplier');else toast('Open Steel package 2 or 3 in this demo.')}));
}
['board','list','detail','supplier'].forEach(boardWire);

/* list: expand rows */
(function(){const r=R.list;const rows=$$('tbody tr',r);
  rows.forEach(tr=>{const b=$('.ib',tr);if(!b)return;const nx=tr.nextElementSibling;const sub=nx&&!$('.ib',nx)&&!nx.classList.contains('grp')?nx:null;
    on(b,()=>{if(!sub){toast('Open Steel package 2 to see its materials.');return}const o=b.getAttribute('aria-expanded')!=='true';b.setAttribute('aria-expanded',o);sub.classList.toggle('x-gone',!o);const sv=$('svg',b);if(sv)sv.style.transform=o?'':'rotate(-90deg)'});
    const name=$('.b5',tr);if(name&&/Steel package 2/.test(name.textContent)){tr.classList.add('x-h');tr.addEventListener('click',e=>{if(e.target.closest('button'))return;go('detail')})}
    if(name&&/Steel package 3/.test(name.textContent)){tr.classList.add('x-h');tr.addEventListener('click',e=>{if(e.target.closest('button'))return;go('supplier')})}
  });
})();

/* create */
(function(){const r=R.create;const ul=$$('ul',r).find(u=>/More to come/.test(u.textContent));
  const cnt=[...r.querySelectorAll('.mono')].find(x=>/materials$/.test(x.textContent.trim()))||byText(r,'span,p,div','3 materials');
  function count(){const n=$$('li',ul).length;if(cnt)cnt.textContent=n+(n===1?' material':' materials');const c=byText(r,'button','Create delivery');if(c){const b=$$('button',r).filter(x=>/Create delivery/.test(x.textContent)).pop();b.disabled=n===0;b.style.opacity=n?'':'.5'}}
  $$('input[type=checkbox]',ul).forEach(cb=>cb.addEventListener('change',()=>{const l=cb.closest('label');l.style.color=cb.checked?'#c2410c':'#5c5c5c';l.style.fontWeight=cb.checked?'500':''}));
  $$('li',ul).forEach(li=>on($('button.ib',li),()=>{li.remove();count();toast('Material removed.')}));
  const close=$$('.modal .ib',r)[0];on(close,()=>go('list'));on(byText(r,'button','Cancel'),()=>go('list'));
  const mk=$$('button',r).filter(x=>/Create delivery/.test(x.textContent)).pop();
  on(mk,()=>{const later=$$('input[type=checkbox]',ul).filter(c=>c.checked).length;toast('Steel package 3 is planned for Thursday'+(later?', with '+later+' more to come':'')+'. Next, a delivery from the supplier’s side.',3600);setTimeout(()=>go('supplier'),1200)});
  const srch=$('input[type=search]',r);if(srch)srch.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();toast('Search is not part of this demo.')}});
  count();
})();

/* supplier */
(function(){const r=R.supplier;
  on(byText(r,'button','Mark more to come'),()=>toast('Coastline Steel can mark what’s still to come. Only Harbor Builders confirms arrivals.',3600));
  on($$('button',r).filter(x=>/Edit delivery/.test(x.textContent)).pop(),()=>go('create'));
  const pnl=$$('aside .ib,[role=dialog] .ib,.pnl .ib',r);pnl.forEach(b=>{if(/Close/i.test(b.getAttribute('aria-label')||''))on(b,()=>go('board'))});
})();

/* confirm */
(function(){const r=R.confirm;const segs=$$('.seg',r);const btn=$$('button',r).filter(x=>/Confirm/.test(x.textContent)).pop();
  const st=$('.stp',r);const lbl=btn.lastChild;
  SEG.confirm=b=>{const yes=/Arrived/.test(b.textContent);b.style.color=yes?'#15803d':'#c2410c';const o=[...b.parentNode.children].find(x=>x!==b);o.style.color='';upd()};
  function upd(){const n=segs.filter(s=>/Arrived/.test(($('.on',s)||{}).textContent||'')).length;
    lbl.textContent=n===0?'Confirm nothing arrived':'Confirm '+n+' of 2 arrived';
    st.className='stp '+(n===2?'rc':n===1?'pr_':'pl');st.innerHTML='<span class="dot"></span>'+(n===2?'Received':n===1?'Partly received':'Planned');}
  let sent=false;
  on(btn,()=>{if(sent){toast('Already confirmed. Click Next to see how status works itself out.');return}
    const n=segs.filter(s=>/Arrived/.test(($('.on',s)||{}).textContent||'')).length,w=n===2?'Received':n===1?'Partly received':'Planned';sent=true;
    btn.style.background='#15803d';btn.style.borderColor='#15803d';lbl.textContent='Confirmed';segs.forEach(s=>$$('button',s).forEach(b=>b.disabled=true));
    const row=$$('tbody tr',R.list).find(tr=>/Steel package 3/.test(tr.textContent)&&$('.stp',tr));if(row){const p=$('.stp',row);p.className=st.className;p.innerHTML=st.innerHTML}
    toast('Confirmed at the gate. Steel package 3 now reads '+w+'.',3400)});
  on($('header .ib',r),()=>go('detail'));
})();

/* detail */
(function(){const r=R.detail;
  on($$('button',r).filter(x=>/Confirm the rest/.test(x.textContent)).pop(),()=>go('confirm'));
  on($$('button',r).filter(x=>/^Edit delivery/.test(x.textContent.trim())).pop(),()=>go('create'));
  $$('a.mono',r).forEach(a=>on(a,()=>go('material')));
  $$('li',r).filter(li=>/HSS columns|W-shapes|Anchor rods/.test(li.textContent)&&$('a.mono',li)).forEach(li=>{li.classList.add('x-h');li.addEventListener('click',()=>go('material'))});
  $$('.ib',r).forEach(b=>{if(/Close/i.test(b.getAttribute('aria-label')||''))on(b,()=>go('board'))});
})();

/* material */
(function(){const r=R.material;
  $$('a',r).filter(a=>/Open/.test(a.textContent)).forEach((a,i)=>on(a,()=>go(i===0?'detail':'supplier')));
  on(byText(r,'button','Add to a delivery'),()=>go('create'));
})();

go('board');
})();
</script>
</body></html>
